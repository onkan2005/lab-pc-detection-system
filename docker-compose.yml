services:
  pc-usage-monitor:
    build: .
    image: pc-usage-monitor:latest
    container_name: pc-usage-monitor
    # 127.0.0.1 only: the app is reachable from this computer, not from the network.
    # (Browsers also only allow camera access on localhost or HTTPS.)
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./enrollment:/enrollment:ro     # student photo folders (read-only)
      - ./detector/data:/data           # embeddings, assignments, logs, incident snapshots
    environment:
      - TZ=${TZ:-Asia/Manila}           # local time for logs and incidents (the container is UTC otherwise)
    restart: unless-stopped
